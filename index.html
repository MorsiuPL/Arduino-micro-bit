<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Projekty Arduino & micro:bit</title>

    <!-- FAVICON (LOGO) -->
    <link rel="icon" type="image/png" href="logo.png">

    <style>
        body { font-family: Arial; max-width: 800px; margin: auto; padding: 20px; }
        header { text-align: center; font-size: 32px; margin-bottom: 20px; }

        #posts {
            max-height: 80vh;
            overflow-y: auto;
            padding-right: 10px;
        }

        .post {
            border: 1px solid #ccc;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 8px;
        }

        .post img, .post video, .post iframe {
            max-width: 100%;
            border-radius: 6px;
            margin-top: 10px;
        }

        .hidden-media {
            display: none;
        }

        .date {
            color: gray;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .date-full {
            color: #555;
            font-size: 13px;
            margin-bottom: 10px;
        }

        #search {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            font-size: 16px;
        }

        #sort {
            padding: 10px;
            font-size: 16px;
            margin-bottom: 20px;
        }

        .content-short {
            max-height: 120px;
            overflow: hidden;
        }

        .expand-btn {
            margin-top: 10px;
            cursor: pointer;
            color: #007bff;
            font-weight: bold;
        }
    </style>
</head>
<body>

<header>Projekty Arduino & micro:bit</header>

<input id="search" placeholder="Szukaj postów...">
<select id="sort">
    <option value="newest">Najnowsze</option>
    <option value="oldest">Najstarsze</option>
    <option value="az">A–Z</option>
    <option value="za">Z–A</option>
</select>

<div id="posts"></div>

<script>
// =========================
// POPRAWNA POLSKA ODMIANA CZASU
// =========================
function plural(n, one, few, many) {
    if (n === 1) return one;
    if (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20)) return few;
    return many;
}

function timeAgo(dateString) {
    const date = new Date(dateString.replace(" ", "T"));
    const now = new Date();
    const diff = now - date;

    const seconds = Math.floor(diff / 1000);
    const minutes = Math.floor(seconds / 60);
    const hours   = Math.floor(minutes / 60);
    const days    = Math.floor(hours / 24);
    const months  = Math.floor(days / 30);
    const years   = Math.floor(days / 365);

    if (years > 0)
        return `opublikowano ${years} ${plural(years, "rok", "lata", "lat")} temu`;

    if (months > 0)
        return `opublikowano ${months} ${plural(months, "miesiąc", "miesiące", "miesięcy")} temu`;

    if (days > 0)
        return `opublikowano ${days} ${plural(days, "dzień", "dni", "dni")} temu`;

    if (hours > 0)
        return `opublikowano ${hours} ${plural(hours, "godzinę", "godziny", "godzin")} temu`;

    if (minutes > 0)
        return `opublikowano ${minutes} ${plural(minutes, "minutę", "minuty", "minut")} temu`;

    return "opublikowano przed chwilą";
}

// =========================
// FORMATOWANIE DATY
// =========================
function formatDate(dateString) {
    const date = new Date(dateString.replace(" ", "T"));
    return date.toLocaleString("pl-PL", {
        year: "numeric",
        month: "long",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit"
    });
}

let allPosts = [];

// =========================
// WYŚWIETLANIE POSTÓW
// =========================
function renderPosts() {
    const search = document.getElementById("search").value.toLowerCase();
    const sort = document.getElementById("sort").value;

    let posts = [...allPosts];

    posts = posts.filter(p =>
        p.title.toLowerCase().includes(search) ||
        p.content.toLowerCase().includes(search)
    );

    if (sort === "newest") posts.sort((a,b) => new Date(b.date) - new Date(a.date));
    if (sort === "oldest") posts.sort((a,b) => new Date(a.date) - new Date(b.date));
    if (sort === "az") posts.sort((a,b) => a.title.localeCompare(b.title));
    if (sort === "za") posts.sort((a,b) => b.title.localeCompare(a.title));

    document.getElementById("posts").innerHTML = "";

    for (let post of posts) {

        // MEDIA (OBRAZY, WIDEO, YT)
        let media = [];
        if (post.image) {
            media = post.image.split(",").map(i => i.trim());
        }

        let mediaHTML = "";
        media.forEach((item, index) => {

            // YouTube
            if (item.includes("youtube.com") || item.includes("youtu.be")) {

                let videoId = item
                    .replace("https://www.youtube.com/watch?v=", "")
                    .replace("https://youtu.be/", "")
                    .replace("https://youtube.com/shorts/", "")
                    .replace("https://www.youtube.com/shorts/", "")
                    .split("?")[0]
                    .trim();

                mediaHTML += `
                    <iframe 
                        id="media-${post.title}-${index}" 
                        class="hidden-media"
                        width="100%" 
                        height="315" 
                        src="https://www.youtube.com/embed/${videoId}" 
                        frameborder="0" 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                        allowfullscreen>
                    </iframe>
                `;
            }

            // WIDEO
            else if (item.endsWith(".mp4") || item.endsWith(".webm") || item.endsWith(".ogg")) {
                mediaHTML += `
                    <video 
                        id="media-${post.title}-${index}" 
                        class="hidden-media"
                        width="100%" 
                        controls>
                        <source src="${item}">
                    </video>
                `;
            }

            // OBRAZEK
            else {
                mediaHTML += `
                    <img 
                        id="media-${post.title}-${index}" 
                        class="hidden-media" 
                        src="${item}">
                `;
            }
        });

        // LINKI
        let linksHTML = "";
        if (post.links) {
            const links = post.links.split(",").map(l => l.trim());

            linksHTML = "<h4>Linki:</h4><ul>";
            links.forEach(link => {
                linksHTML += `<li><a href="${link}" target="_blank">${link}</a></li>`;
            });
            linksHTML += "</ul>";
        }

        const postId = Math.random().toString(36).substr(2, 9);

        document.getElementById("posts").innerHTML += `
            <div class="post">
                <div class="date">${timeAgo(post.date)}</div>
                <div class="date-full">${formatDate(post.date)}</div>

                <h3>${post.title}</h3>

                <p id="content-${postId}" class="content-short">${post.content}</p>
                <div class="expand-btn" onclick="toggleContent('${postId}', '${post.title}')">Rozwiń</div>

                ${mediaHTML}
                ${linksHTML}
            </div>
        `;
    }
}

// =========================
// ROZWIJANIE POSTÓW
// =========================
function toggleContent(id, title) {
    const el = document.getElementById("content-" + id);
    const btn = el.nextElementSibling;

    const media = document.querySelectorAll(`*[id^="media-${title}"]`);

    if (el.classList.contains("content-short")) {
        el.classList.remove("content-short");
        btn.textContent = "Zwiń";

        media.forEach(m => m.classList.remove("hidden-media"));

    } else {
        el.classList.add("content-short");
        btn.textContent = "Rozwiń";

        media.forEach(m => m.classList.add("hidden-media"));
    }
}

// =========================
// WCZYTYWANIE POSTÓW
// =========================
async function loadPosts() {
    const res = await fetch("posts.json");
    allPosts = await res.json();
    renderPosts();
}

loadPosts();

document.getElementById("search").addEventListener("input", renderPosts);
document.getElementById("sort").addEventListener("change", renderPosts);
</script>

</body>
</html>
